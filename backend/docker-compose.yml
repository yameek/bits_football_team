services:
  # PostgreSQL Database (runs in Docker)
  postgres:
    image: postgres:17-alpine
    container_name: football_treasury_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-football_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-football_password_2025}
      POSTGRES_DB: ${DB_NAME:-football_treasury}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-football_admin}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend is now run natively on host with npm run dev
  # To start backend: npm run dev (from backend directory)

volumes:
  postgres_data:
    driver: local
